    <rect x="28" y="12" width="6" height="2" fill="#cfa75f" />
    <rect x="26" y="15" width="5" height="3" fill="#d74438" /><rect x="54" y="15" width="5" height="3" fill="#123d4b" />
  </g>
  <g class="frame frame-5">
    <use href="#helicopter-body" transform="translate(0,1)" />
    <rect x="43" y="8" width="2" height="8" fill="#cfa75f" /><rect x="25" y="8" width="38" height="2" fill="#cfa75f" />
    <rect x="23" y="11" width="7" height="2" fill="#cfa75f" /><rect x="58" y="11" width="7" height="2" fill="#cfa75f" />
    <rect x="26" y="16" width="5" height="3" fill="#3a382a" /><rect x="54" y="16" width="5" height="3" fill="#3c8bc3" />
  </g>
  <g class="frame frame-6">
    <use href="#helicopter-body" />
    <rect x="43" y="8" width="2" height="8" fill="#cfa75f" /><rect x="25" y="7" width="38" height="2" fill="#cfa75f" />
    <rect x="28" y="12" width="6" height="2" fill="#cfa75f" />
    <rect x="26" y="15" width="5" height="3" fill="#d74438" /><rect x="54" y="15" width="5" height="3" fill="#123d4b" />
  </g>
  <g class="frame frame-7">
    <use href="#helicopter-body" transform="translate(0,-1)" />
    <rect x="43" y="7" width="2" height="9" fill="#cfa75f" /><rect x="25" y="6" width="38" height="2" fill="#cfa75f" />
    <rect x="28" y="10" width="6" height="2" fill="#cfa75f" />
    <rect x="26" y="14" width="5" height="3" fill="#3a382a" /><rect x="54" y="14" width="5" height="3" fill="#3c8bc3" />
  </g>
  <g class="frame frame-8">
    <use href="#helicopter-body" />
    <rect x="43" y="8" width="2" height="8" fill="#cfa75f" /><rect x="25" y="7" width="38" height="2" fill="#cfa75f" />
    <rect x="23" y="11" width="7" height="2" fill="#cfa75f" /><rect x="58" y="11" width="7" height="2" fill="#cfa75f" />
    <rect x="26" y="15" width="5" height="3" fill="#d74438" /><rect x="54" y="15" width="5" height="3" fill="#123d4b" />
  </g>
  <g class="frame frame-9">
    <use href="#helicopter-body" transform="translate(0,1)" />
    <rect x="43" y="8" width="2" height="8" fill="#cfa75f" /><rect x="25" y="8" width="38" height="2" fill="#cfa75f" />
    <rect x="28" y="12" width="6" height="2" fill="#cfa75f" />
    <rect x="26" y="16" width="5" height="3" fill="#3a382a" /><rect x="54" y="16" width="5" height="3" fill="#3c8bc3" />
  </g>
