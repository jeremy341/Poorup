<svg xmlns="http://www.w3.org/2000/svg" width="96" height="48" viewBox="0 0 96 48" shape-rendering="crispEdges" role="img" aria-label="Pixel police helicopter animation">
  <title>Pixel police helicopter</title>
  <desc>Ten stepped pixel-art frames with an alternating red and blue emergency beacon.</desc>
  <style>
    .frame { opacity: 0; animation: frame-cycle 1s steps(1, end) infinite; }
    .frame-0 { animation-delay: 0s; }
    .frame-1 { animation-delay: -0.1s; }
    .frame-2 { animation-delay: -0.2s; }
    .frame-3 { animation-delay: -0.3s; }
    .frame-4 { animation-delay: -0.4s; }
    .frame-5 { animation-delay: -0.5s; }
    .frame-6 { animation-delay: -0.6s; }
    .frame-7 { animation-delay: -0.7s; }
    .frame-8 { animation-delay: -0.8s; }
    .frame-9 { animation-delay: -0.9s; }
    @keyframes frame-cycle { 0%, 9.99% { opacity: 1; } 10%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .frame { animation: none; }
      .frame-0 { opacity: 1; }
    }
  </style>
  <defs>
    <g id="helicopter-body">
      <rect x="21" y="19" width="42" height="14" fill="#123d4b" />
      <rect x="27" y="16" width="26" height="5" fill="#1b5360" />
      <rect x="31" y="17" width="17" height="5" fill="#031d1e" />
      <rect x="33" y="18" width="6" height="3" fill="#3e7d7b" />
      <rect x="41" y="18" width="6" height="3" fill="#0d2725" />
      <rect x="21" y="22" width="4" height="8" fill="#cfa75f" />
      <rect x="25" y="30" width="35" height="4" fill="#0a2227" />
      <rect x="30" y="34" width="4" height="3" fill="#cfa75f" />
      <rect x="50" y="34" width="4" height="3" fill="#cfa75f" />
      <rect x="60" y="22" width="10" height="4" fill="#123d4b" />
      <rect x="69" y="18" width="4" height="11" fill="#1b5360" />
      <rect x="72" y="16" width="3" height="3" fill="#cfa75f" />
      <rect x="17" y="26" width="4" height="3" fill="#cfa75f" />
      <rect x="12" y="28" width="9" height="2" fill="#cfa75f" />
    </g>
  </defs>

  <g class="frame frame-0">
    <use href="#helicopter-body" />
    <rect x="43" y="8" width="2" height="8" fill="#cfa75f" /><rect x="25" y="7" width="38" height="2" fill="#cfa75f" />
    <rect x="28" y="12" width="6" height="2" fill="#cfa75f" />
    <rect x="26" y="15" width="5" height="3" fill="#d74438" /><rect x="54" y="15" width="5" height="3" fill="#123d4b" />
  </g>
  <g class="frame frame-1">
    <use href="#helicopter-body" transform="translate(0,1)" />
    <rect x="43" y="8" width="2" height="8" fill="#cfa75f" /><rect x="25" y="8" width="38" height="2" fill="#cfa75f" />
    <rect x="28" y="12" width="6" height="2" fill="#cfa75f" />
    <rect x="26" y="16" width="5" height="3" fill="#3a382a" /><rect x="54" y="16" width="5" height="3" fill="#3c8bc3" />
  </g>
  <g class="frame frame-2">
    <use href="#helicopter-body" />
    <rect x="43" y="8" width="2" height="8" fill="#cfa75f" /><rect x="25" y="7" width="38" height="2" fill="#cfa75f" />
    <rect x="23" y="11" width="7" height="2" fill="#cfa75f" /><rect x="58" y="11" width="7" height="2" fill="#cfa75f" />
    <rect x="26" y="15" width="5" height="3" fill="#d74438" /><rect x="54" y="15" width="5" height="3" fill="#123d4b" />
  </g>
  <g class="frame frame-3">
    <use href="#helicopter-body" transform="translate(0,-1)" />
    <rect x="43" y="7" width="2" height="9" fill="#cfa75f" /><rect x="25" y="6" width="38" height="2" fill="#cfa75f" />
    <rect x="28" y="10" width="6" height="2" fill="#cfa75f" />
    <rect x="26" y="14" width="5" height="3" fill="#3a382a" /><rect x="54" y="14" width="5" height="3" fill="#3c8bc3" />
  </g>
  <g class="frame frame-4">
    <use href="#helicopter-body" />
