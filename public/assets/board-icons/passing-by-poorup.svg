    <rect x="1" y="1" width="138" height="137" rx="15" fill="none" stroke="#9b783d" stroke-width="2"/>
    <rect x="5" y="5" width="130" height="129" rx="12" fill="none" stroke="#3a382a" stroke-width="1"/>
    <text x="70" y="31" text-anchor="middle" fill="#e8d3ab" font-family="Pixelify Sans, monospace" font-size="15" font-weight="400" letter-spacing="0">Passing by</text>
