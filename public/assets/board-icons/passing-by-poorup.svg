<svg xmlns="http://www.w3.org/2000/svg" width="140" height="139" viewBox="0 0 140 139" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Passing By corner tile</title>
  <desc id="desc">The supplied combined Passing By and prison layout restyled in Poorup's dark teal and gold visual system.</desc>
  <defs>
    <clipPath id="tile-clip">
      <rect width="140" height="139" rx="16"/>
    </clipPath>
    <linearGradient id="prison-depth" x1="43" y1="50" x2="43" y2="139" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b2020"/>
      <stop offset="1" stop-color="#031314"/>
    </linearGradient>
    <style>
      @font-face {
        font-family: "Pixelify Sans";
        src: url("/assets/fonts/pixelify-sans-400.woff2") format("woff2");
        font-weight: 400;
      }
    </style>
  </defs>
  <g clip-path="url(#tile-clip)">
