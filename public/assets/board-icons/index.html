<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poorup Board Icons</title><style>body{margin:0;padding:32px;background:#01070a;color:#e8d3ab;font-family:monospace}h1{color:#e0b972}.grid{display:grid;grid-template-columns:repeat(3,minmax(180px,260px));gap:16px}.card{padding:18px;border:1px solid #5c5033;background:#071314}.card img{display:block;width:180px;height:180px;margin:auto;object-fit:contain;image-rendering:pixelated}.card p{margin:12px 0 0;color:#cfa75f;text-transform:uppercase;letter-spacing:.08em}@media(max-width:720px){.grid{grid-template-columns:1fr}.card img{width:150px;height:150px}}</style></head><body><h1>POORUP / BOARD ICONS</h1><main class="grid"><section class="card"><img src="treasure-chest.svg" alt="Treasure chest"><p>Treasure chest</p></section><section class="card"><img src="vault.svg" alt="Vault"><p>Vault</p></section><section class="card"><img src="surprise.svg" alt="Surprise question mark"><p>Surprise</p></section></main></body></html>
