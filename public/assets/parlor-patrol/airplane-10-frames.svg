<svg xmlns="http://www.w3.org/2000/svg" width="112" height="64" viewBox="0 0 112 64" shape-rendering="crispEdges" role="img" aria-labelledby="airplane-title airplane-desc">
  <title id="airplane-title">Night Shift pixel airplane</title>
  <desc id="airplane-desc">Ten original pixel frames for a fast aircraft with a restrained navigation blink.</desc>
  <style>
    .frame { opacity: 0; animation: show-airplane 1s steps(1, end) infinite; }
    .frame-00 { animation-delay: 0ms; }.frame-01 { animation-delay: -100ms; }.frame-02 { animation-delay: -200ms; }.frame-03 { animation-delay: -300ms; }.frame-04 { animation-delay: -400ms; }
    .frame-05 { animation-delay: -500ms; }.frame-06 { animation-delay: -600ms; }.frame-07 { animation-delay: -700ms; }.frame-08 { animation-delay: -800ms; }.frame-09 { animation-delay: -900ms; }
    @keyframes show-airplane { 0%, 9.99% { opacity: 1; } 10%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .frame { animation: none; } .frame-00 { opacity: 1; } }
  </style>
