<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" shape-rendering="crispEdges" role="img" aria-labelledby="drone-explosion-title drone-explosion-desc">
  <title id="drone-explosion-title">Night Shift drone explosion</title>
  <desc id="drone-explosion-desc">Ten original stepped pixel frames for a large red and orange drone impact.</desc>
  <style>
    .frame { opacity: 0; animation: show-drone-explosion 800ms steps(1, end) infinite; }
    .frame-00 { animation-delay: 0ms; }.frame-01 { animation-delay: -80ms; }.frame-02 { animation-delay: -160ms; }
    .frame-03 { animation-delay: -240ms; }.frame-04 { animation-delay: -320ms; }.frame-05 { animation-delay: -400ms; }
    .frame-06 { animation-delay: -480ms; }.frame-07 { animation-delay: -560ms; }.frame-08 { animation-delay: -640ms; }.frame-09 { animation-delay: -720ms; }
    @keyframes show-drone-explosion { 0%, 9.99% { opacity: 1; } 10%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .frame { animation: none; } .frame-00 { opacity: 1; } }
  </style>
