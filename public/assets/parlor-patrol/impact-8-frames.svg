<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img" aria-labelledby="impact-title impact-desc">
  <title id="impact-title">Parlor Patrol pixel impact</title>
  <desc id="impact-desc">Eight short pixel-art impact frames that expand from a gold hit flash into teal smoke.</desc>
  <style>
    .frame { opacity: 0; animation: show-impact .64s steps(1, end) infinite; }
    .frame-00 { animation-delay: 0s; }
    .frame-01 { animation-delay: -.08s; }
    .frame-02 { animation-delay: -.16s; }
    .frame-03 { animation-delay: -.24s; }
    .frame-04 { animation-delay: -.32s; }
    .frame-05 { animation-delay: -.4s; }
    .frame-06 { animation-delay: -.48s; }
    .frame-07 { animation-delay: -.56s; }
    @keyframes show-impact {
      0%, 12.49% { opacity: 1; }
      12.5%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .frame { animation: none; }
      .frame-00 { opacity: 1; }
    }
  </style>

  <g id="frame-00" class="frame frame-00">
    <rect x="28" y="28" width="8" height="8" fill="#f0d9ac" />
    <rect x="24" y="30" width="16" height="4" fill="#cfa75f" />
    <rect x="30" y="24" width="4" height="16" fill="#cfa75f" />
  </g>
  <g id="frame-01" class="frame frame-01">
    <rect x="26" y="26" width="12" height="12" fill="#f0d9ac" />
    <rect x="20" y="30" width="24" height="4" fill="#d74438" />
    <rect x="30" y="20" width="4" height="24" fill="#286ea1" />
    <rect x="16" y="24" width="5" height="4" fill="#cfa75f" /><rect x="43" y="36" width="5" height="4" fill="#cfa75f" />
  </g>
  <g id="frame-02" class="frame frame-02">
    <rect x="24" y="24" width="16" height="16" fill="#d74438" />
    <rect x="28" y="28" width="8" height="8" fill="#f0d9ac" />
    <rect x="14" y="30" width="8" height="4" fill="#cfa75f" /><rect x="42" y="30" width="8" height="4" fill="#cfa75f" />
    <rect x="30" y="14" width="4" height="8" fill="#286ea1" /><rect x="30" y="42" width="4" height="8" fill="#286ea1" />
  </g>
  <g id="frame-03" class="frame frame-03">
    <rect x="25" y="25" width="14" height="14" fill="#f0d9ac" />
    <rect x="20" y="27" width="4" height="4" fill="#d74438" /><rect x="40" y="33" width="4" height="4" fill="#d74438" />
    <rect x="29" y="16" width="6" height="6" fill="#286ea1" /><rect x="29" y="42" width="6" height="6" fill="#286ea1" />
    <rect x="16" y="19" width="6" height="5" fill="#cfa75f" /><rect x="42" y="40" width="6" height="5" fill="#cfa75f" />
  </g>
  <g id="frame-04" class="frame frame-04">
    <rect x="27" y="27" width="10" height="10" fill="#3e7d7b" />
    <rect x="22" y="23" width="6" height="6" fill="#286ea1" /><rect x="36" y="35" width="6" height="6" fill="#286ea1" />
    <rect x="16" y="27" width="5" height="5" fill="#d74438" /><rect x="43" y="32" width="5" height="5" fill="#d74438" />
    <rect x="28" y="15" width="5" height="6" fill="#cfa75f" /><rect x="31" y="43" width="5" height="6" fill="#cfa75f" />
  </g>
  <g id="frame-05" class="frame frame-05">
    <rect x="24" y="30" width="16" height="8" fill="#123d4b" />
    <rect x="20" y="25" width="7" height="7" fill="#3e7d7b" /><rect x="37" y="35" width="7" height="7" fill="#3e7d7b" />
    <rect x="16" y="22" width="5" height="5" fill="#286ea1" /><rect x="43" y="40" width="5" height="5" fill="#286ea1" />
    <rect x="28" y="17" width="5" height="5" fill="#cfa75f" /><rect x="32" y="47" width="5" height="5" fill="#cfa75f" />
  </g>
  <g id="frame-06" class="frame frame-06">
    <rect x="23" y="32" width="18" height="8" fill="#123d4b" />
    <rect x="18" y="27" width="8" height="7" fill="#3e7d7b" /><rect x="39" y="36" width="8" height="7" fill="#3e7d7b" />
    <rect x="13" y="24" width="5" height="5" fill="#286ea1" /><rect x="48" y="41" width="5" height="5" fill="#286ea1" />
    <rect x="26" y="18" width="5" height="5" fill="#cfa75f" /><rect x="34" y="49" width="5" height="5" fill="#cfa75f" />
  </g>
  <g id="frame-07" class="frame frame-07">
    <rect x="20" y="35" width="24" height="6" fill="#071314" />
    <rect x="15" y="30" width="8" height="7" fill="#123d4b" /><rect x="41" y="37" width="8" height="7" fill="#123d4b" />
    <rect x="10" y="27" width="5" height="5" fill="#286ea1" /><rect x="49" y="43" width="5" height="5" fill="#286ea1" />
    <rect x="23" y="22" width="5" height="5" fill="#3e7d7b" /><rect x="36" y="48" width="5" height="5" fill="#3e7d7b" />
  </g>
</svg>
