<svg xmlns="http://www.w3.org/2000/svg" width="96" height="32" viewBox="0 0 96 32" shape-rendering="crispEdges" role="img" aria-labelledby="contrail-title contrail-desc">
  <title id="contrail-title">Night Shift aircraft contrail</title>
  <desc id="contrail-desc">Six short stepped teal and gold pixel contrail frames.</desc>
  <style>
    .frame { opacity: 0; animation: show-contrail 600ms steps(1, end) infinite; }
    .frame-00 { animation-delay: 0ms; }.frame-01 { animation-delay: -100ms; }.frame-02 { animation-delay: -200ms; }.frame-03 { animation-delay: -300ms; }.frame-04 { animation-delay: -400ms; }.frame-05 { animation-delay: -500ms; }
    @keyframes show-contrail { 0%, 16.49% { opacity: 1; } 16.5%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .frame { animation: none; } .frame-00 { opacity: 1; } }
  </style>
  <g id="frame-00" class="frame frame-00"><rect x="8" y="14" width="60" height="4" fill="#3e7d7b"/><rect x="20" y="10" width="34" height="3" fill="#123d4b"/></g>
  <g id="frame-01" class="frame frame-01"><rect x="8" y="14" width="54" height="4" fill="#3e7d7b"/><rect x="18" y="10" width="30" height="3" fill="#123d4b"/><rect x="62" y="20" width="12" height="3" fill="#c88f2e"/></g>
  <g id="frame-02" class="frame frame-02"><rect x="8" y="14" width="48" height="4" fill="#3e7d7b"/><rect x="16" y="10" width="24" height="3" fill="#123d4b"/><rect x="54" y="20" width="16" height="3" fill="#c88f2e"/></g>
  <g id="frame-03" class="frame frame-03"><rect x="8" y="14" width="40" height="4" fill="#3e7d7b"/><rect x="14" y="10" width="20" height="3" fill="#123d4b"/><rect x="46" y="20" width="12" height="3" fill="#c88f2e"/></g>
  <g id="frame-04" class="frame frame-04"><rect x="8" y="14" width="32" height="4" fill="#3e7d7b"/><rect x="12" y="10" width="16" height="3" fill="#123d4b"/><rect x="38" y="20" width="8" height="3" fill="#c88f2e"/></g>
  <g id="frame-05" class="frame frame-05"><rect x="8" y="14" width="24" height="4" fill="#3e7d7b"/><rect x="10" y="10" width="10" height="3" fill="#123d4b"/><rect x="30" y="20" width="5" height="3" fill="#c88f2e"/></g>
</svg>
