<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64" shape-rendering="crispEdges" role="img" aria-labelledby="drone-title drone-desc">
  <title id="drone-title">Parlor Patrol pixel drone</title>
  <desc id="drone-desc">Eight compact pixel drone frames with a blinking blue and red signal light.</desc>
  <style>
    .frame { opacity: 0; animation: show-drone .8s steps(1, end) infinite; }
    .frame-00 { animation-delay: 0s; }.frame-01 { animation-delay: -.1s; }.frame-02 { animation-delay: -.2s; }.frame-03 { animation-delay: -.3s; }
    .frame-04 { animation-delay: -.4s; }.frame-05 { animation-delay: -.5s; }.frame-06 { animation-delay: -.6s; }.frame-07 { animation-delay: -.7s; }
    @keyframes show-drone { 0%, 12.49% { opacity: 1; } 12.5%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .frame { animation: none; } .frame-00 { opacity: 1; } }
  </style>
  <g id="drone-body">
    <path fill="#030c10" d="M18 27h10v-6h40v6h10v13H68v5H28v-5H18z" />
    <rect x="30" y="25" width="36" height="12" fill="#123d4b" />
    <rect x="35" y="28" width="8" height="5" fill="#286ea1" /><rect x="46" y="28" width="8" height="5" fill="#3e7d7b" /><rect x="57" y="28" width="6" height="5" fill="#286ea1" />
    <rect x="25" y="37" width="46" height="3" fill="#071314" />
    <rect x="10" y="22" width="20" height="3" fill="#cfa75f" /><rect x="66" y="22" width="20" height="3" fill="#cfa75f" />
    <rect x="22" y="18" width="3" height="7" fill="#9b783d" /><rect x="71" y="18" width="3" height="7" fill="#9b783d" />
    <rect x="32" y="40" width="3" height="7" fill="#9b783d" /><rect x="61" y="40" width="3" height="7" fill="#9b783d" />
    <rect x="44" y="40" width="8" height="3" fill="#f0d9ac" />
  </g>
  <g id="frame-00" class="frame frame-00"><use href="#drone-body" /><rect x="45" y="20" width="6" height="4" fill="#d74438" /></g>
  <g id="frame-01" class="frame frame-01"><use href="#drone-body" /><rect x="45" y="18" width="6" height="4" fill="#286ea1" /></g>
  <g id="frame-02" class="frame frame-02"><use href="#drone-body" /><rect x="45" y="20" width="6" height="4" fill="#d74438" /></g>
  <g id="frame-03" class="frame frame-03"><use href="#drone-body" /><rect x="45" y="18" width="6" height="4" fill="#286ea1" /></g>
  <g id="frame-04" class="frame frame-04"><use href="#drone-body" /><rect x="45" y="20" width="6" height="4" fill="#d74438" /></g>
  <g id="frame-05" class="frame frame-05"><use href="#drone-body" /><rect x="45" y="18" width="6" height="4" fill="#286ea1" /></g>
  <g id="frame-06" class="frame frame-06"><use href="#drone-body" /><rect x="45" y="20" width="6" height="4" fill="#d74438" /></g>
  <g id="frame-07" class="frame frame-07"><use href="#drone-body" /><rect x="45" y="18" width="6" height="4" fill="#286ea1" /></g>
</svg>
