<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" shape-rendering="crispEdges" role="img" aria-labelledby="beacon-title beacon-desc">
  <title id="beacon-title">Parlor Patrol falling beacon</title>
  <desc id="beacon-desc">Six compact pixel beacon frames for a falling bonus object.</desc>
  <style>
    .frame { opacity: 0; animation: show-beacon .6s steps(1, end) infinite; }
    .frame-00 { animation-delay: 0s; }.frame-01 { animation-delay: -.1s; }.frame-02 { animation-delay: -.2s; }
    .frame-03 { animation-delay: -.3s; }.frame-04 { animation-delay: -.4s; }.frame-05 { animation-delay: -.5s; }
    @keyframes show-beacon { 0%, 16.65% { opacity: 1; } 16.66%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .frame { animation: none; } .frame-00 { opacity: 1; } }
  </style>
  <g id="frame-00" class="frame frame-00"><rect x="19" y="8" width="10" height="6" fill="#f0d9ac" /><rect x="14" y="14" width="20" height="20" fill="#cfa75f" /><rect x="19" y="19" width="10" height="10" fill="#286ea1" /><rect x="21" y="34" width="6" height="6" fill="#3e7d7b" /></g>
  <g id="frame-01" class="frame frame-01"><rect x="18" y="6" width="12" height="6" fill="#f0d9ac" /><rect x="12" y="12" width="24" height="22" fill="#cfa75f" /><rect x="18" y="18" width="12" height="10" fill="#d74438" /><rect x="21" y="34" width="6" height="8" fill="#3e7d7b" /></g>
  <g id="frame-02" class="frame frame-02"><rect x="16" y="8" width="16" height="5" fill="#cfa75f" /><rect x="10" y="13" width="28" height="20" fill="#f0d9ac" /><rect x="17" y="18" width="14" height="10" fill="#286ea1" /><rect x="21" y="34" width="6" height="7" fill="#3e7d7b" /></g>
  <g id="frame-03" class="frame frame-03"><rect x="14" y="10" width="20" height="5" fill="#cfa75f" /><rect x="8" y="15" width="32" height="18" fill="#f0d9ac" /><rect x="16" y="19" width="16" height="9" fill="#d74438" /><rect x="20" y="34" width="8" height="6" fill="#3e7d7b" /></g>
  <g id="frame-04" class="frame frame-04"><rect x="12" y="12" width="24" height="5" fill="#3e7d7b" /><rect x="8" y="17" width="32" height="16" fill="#cfa75f" /><rect x="17" y="20" width="14" height="8" fill="#286ea1" /><rect x="20" y="34" width="8" height="5" fill="#123d4b" /></g>
  <g id="frame-05" class="frame frame-05"><rect x="10" y="14" width="28" height="5" fill="#123d4b" /><rect x="6" y="19" width="36" height="14" fill="#3e7d7b" /><rect x="16" y="21" width="16" height="8" fill="#d74438" /><rect x="19" y="34" width="10" height="4" fill="#123d4b" /></g>
</svg>
