<svg xmlns="http://www.w3.org/2000/svg" width="128" height="96" viewBox="0 0 128 96" shape-rendering="crispEdges" role="img" aria-labelledby="crash-title crash-desc">
  <title id="crash-title">Parlor Patrol falling helicopter</title>
  <desc id="crash-desc">Twelve stepped pixel frames of a tagged helicopter falling with fire and smoke.</desc>
  <style>
    .frame { opacity: 0; animation: show-crash 1.08s steps(1, end) infinite; }
    .frame-00 { animation-delay: 0s; }
    .frame-01 { animation-delay: -.09s; }
    .frame-02 { animation-delay: -.18s; }
    .frame-03 { animation-delay: -.27s; }
    .frame-04 { animation-delay: -.36s; }
    .frame-05 { animation-delay: -.45s; }
    .frame-06 { animation-delay: -.54s; }
    .frame-07 { animation-delay: -.63s; }
    .frame-08 { animation-delay: -.72s; }
    .frame-09 { animation-delay: -.81s; }
    .frame-10 { animation-delay: -.9s; }
    .frame-11 { animation-delay: -.99s; }
    @keyframes show-crash {
      0%, 8.32% { opacity: 1; }
      8.33%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .frame { animation: none; }
      .frame-00 { opacity: 1; }
    }
  </style>
