name: CI

# Two lanes, two tiers:
#
#   testing is the gate lane. Every pull request and every queued merge runs
#   the full battery before the merge lands: lint and audit, four test-shards
#   with server coverage and floors, boot and docker smokes, and browser QA
#   (four shards over the two representative viewport profiles).
#
#   main is the release lane. A promotion PR and its post-merge push run the
#   fast tier: lint, boot and docker smokes plus the tree check, which proves
#   main carries exactly the tree that passed the full battery on testing.
#
# Required status checks are "test" and "boot smoke" on both lanes.
on:
  pull_request:
    branches: [testing, main]
  # Merge-queue groups: if a queue is enabled on testing, it runs checks on
  # temporary gh-readonly-queue branches; without this trigger the required
  # checks would never be reported and every queued merge would fail.
  merge_group:
    branches: [testing]
  # A push to main is the post-merge verification of a promotion that already
  # passed the full battery on testing. Local/generated outputs are ignored.
  push:
    branches: [main]
    paths-ignore:
      - 'qa-artifacts/**'
      - '.codescene/**'
  # A manual run exercises the full battery.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: pipeline tier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.set.outputs.tier }}
    steps:
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # pull_request -> testing and any merge-queue group run the full
          # battery; everything else (pull_request -> main, push to main) is
          # the release lane's fast verification. Empty output fails fast.
          tier=fast
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            tier=full
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "testing" ]; then
            tier=full
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "tier=$tier event=$EVENT_NAME base=$BASE_REF"

  lint:
    name: lint and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run lint:client
      - name: Validate the unique test manifest
        run: node scripts/test-manifest.test.mjs
      - name: Docs contract suites
        # These two suites keep README and feature-status claims honest, so
        # they run unconditionally on both tiers.
        run: |
          node server/docs-parity.test.js
          node server/docsFeatureStatus.test.js

  server-tests:
    name: server and client contracts · shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [plan, lint]
    if: needs.plan.outputs.tier == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: Run one deterministic manifest shard with server coverage
        # Suites are independent processes with isolated stores and distinct
        # ports, so shards run four at a time; POORUP_TEST_PARALLELISM=1 is
        # the sequential fallback.
        run: >-
          npx c8 --temp-directory .nyc_output --include="server/**" --reporter=text
          node scripts/run-test-manifest.mjs --group=full
          --shard=${{ matrix.shard }}/4
          --timings=.test-timings/shard-${{ matrix.shard }}.json
        env:
          POORUP_TEST_PARALLELISM: '4'
      - name: Upload raw V8 coverage for merge
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-shard-${{ matrix.shard }}
          path: .nyc_output
          include-hidden-files: true
          if-no-files-found: warn
          # Merged by the coverage job in this same run; a day is enough.
          retention-days: 1
      - name: Upload per-suite timing record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-timings-shard-${{ matrix.shard }}
          path: .test-timings/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, server-tests]
    if: needs.plan.outputs.tier == 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: Download all test-shard coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-shard-*
          path: .nyc_output
          merge-multiple: true
      - name: Merge and report coverage
        # Floors sit one point under the measured full-group baseline (lines
        # and statements 89.6, functions 88.1, branches 77.7 on the server
        # tree). A drop below a floor fails the job; raise the floors when
        # coverage rises.
        run: npx c8 report --temp-directory .nyc_output --include="server/**" --reporter=text --reporter=lcov --check-coverage --lines 88 --functions 87 --branches 76 --statements 88
      # The repository is public; Codecov uploads work without a token, and
      # omitting one keeps forked PRs out of the secret path entirely.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: server
          fail_ci_if_error: false

  ci-report:
    name: shard timing report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, server-tests]
    if: always() && !cancelled() && needs.server-tests.result != 'skipped'
    steps:
      - uses: actions/checkout@v4
      - name: Download per-suite timing records
        uses: actions/download-artifact@v7
        with:
          pattern: test-timings-shard-*
          path: .test-timings
          merge-multiple: false
      - name: Report the slowest suites and shard skew
        run: node scripts/ci-timings-report.mjs .test-timings

  boot:
    name: boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: The shipped package manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      - name: Server boots and serves the app shell in production mode
        # Production turns on the origin allow-list, the absolute storage-path
        # guard and the backup readiness gate. The directories live under the
        # runner temp dir, outside the checkout, as the production guard
        # requires.
        run: |
          BOOT_DIR="$RUNNER_TEMP/poorup-boot"
          mkdir -p "$BOOT_DIR/data" "$BOOT_DIR/backups"
          NODE_ENV=production POORUP_ALLOWED_ORIGINS=http://localhost:8099 POORUP_DATA_DIR="$BOOT_DIR/data" POORUP_BACKUP_DIR="$BOOT_DIR/backups" \
          POORUP_HTTP_RATE_LIMIT=240 POORUP_HTTP_RATE_WINDOW_MS=60000 POORUP_SOCKET_RATE_LIMIT=120 POORUP_SOCKET_RATE_WINDOW_MS=60000 \
          PORT=8099 node server/server.js & SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS localhost:8099/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS localhost:8099/ | grep -qi poorup
          curl -fsS localhost:8099/healthz | grep -q '"status":"ok"'
          curl -fsS localhost:8099/readyz | grep -q '"status":"ready"'
          kill $SERVER_PID

  docker:
    name: container image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t poorup:ci .
      - name: The image boots in production mode and reports ready
        # The image runs as the node user and keeps its stores in the declared
        # volume. The origin allow-list is required in production.
        run: |
          docker run -d --name poorup-ci -p 8080:8080 -e POORUP_ALLOWED_ORIGINS=http://localhost:8080 poorup:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS localhost:8080/healthz | grep -q '"status":"ok"'
          curl -fsS localhost:8080/readyz | grep -q '"status":"ready"'
      - name: Container logs on failure
        if: failure()
        run: docker logs poorup-ci

  browser-shards:
    name: browser QA shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [plan]
    if: needs.plan.outputs.tier == 'full'
    # The pinned Playwright image already carries Chromium and its system
    # libraries, so a shard skips the browser download and the apt install.
    # The tag must match the locked @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: Start the local parlor
        run: |
          PORT=8099 node server/server.js > /tmp/poorup-browser.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS localhost:8099/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS localhost:8099/ >/dev/null
      - name: UI and accessibility contract shard
        # Both representative viewport profiles on every gate-lane merge, no
        # retries: a real failure reports at once.
        run: >-
          POORUP_QA_RETRIES=0 npm run test:browser -- --workers=2
          --project=desktop-1920x1080 --project=ipad-1194x834
          --shard=${{ matrix.shard }}/4 --reporter=blob
        env:
          POORUP_QA_BASE_URL: http://127.0.0.1:8099
      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: warn
          # Consumed by the merge step in this same run; a day is enough.
          retention-days: 1

  browser:
    name: browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [plan, browser-shards]
    if: always() && needs.plan.outputs.tier == 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      - name: Download Playwright shard reports
        if: needs.browser-shards.result == 'failure'
        uses: actions/download-artifact@v7
        with:
          pattern: playwright-blob-shard-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        if: needs.browser-shards.result == 'failure'
        run: npx playwright merge-reports --reporter=html all-blob-reports
      - name: Upload merged Playwright report
        if: always() && needs.browser-shards.result == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 7
      - name: Require every browser shard
        if: always()
        run: test "${{ needs.browser-shards.result }}" = success

  tree-check:
    name: tree check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan]
    if: needs.plan.outputs.tier == 'fast'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The merged tree must be byte-identical to testing
        # The fast tier's tree check proves main carries exactly the tested
        # testing tree; a lighter run did not (G12-04).
        run: |
          git fetch origin testing --quiet
          HEAD_TREE=$(git rev-parse "HEAD^{tree}")
          TEST_TREE=$(git rev-parse "origin/testing^{tree}")
          echo "head=$HEAD_TREE testing=$TEST_TREE"
          if [ "$HEAD_TREE" != "$TEST_TREE" ]; then
            echo "::error::HEAD tree $HEAD_TREE differs from origin/testing tree $TEST_TREE. Content reached main that never passed full CI on testing."
            exit 1
          fi
          echo "trees match: $HEAD_TREE"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ci-report is observability and intentionally outside the gate: a report
    # hiccup must never block a merge.
    needs: [plan, lint, server-tests, coverage, boot, docker, browser, tree-check]
    if: always()
    steps:
      - name: Tier-aware gate for the required test check
        env:
          TIER: ${{ needs.plan.outputs.tier }}
        run: |
          FAIL=0

          expect() {
            label="$1"
            result="$2"
            mode="$3"
            if [ "$result" = "success" ]; then
              echo "ok: $label -> success"
            elif [ "$result" = "skipped" ] && [ "$mode" = "skipok" ]; then
              echo "ok: $label -> skipped (allowed on tier=$TIER)"
            else
              echo "::error::$label -> '$result' on tier=$TIER (expected success)"
              FAIL=1
            fi
          }

          case "$TIER" in
            full)
              # Gate lane: the whole battery is required.
              SERVER=required; COVERAGE=required; BROWSER=required; TREE=skipok; DOCKER=required ;;
            fast)
              # Release lane: verification only, and the tree check is the
              # load-bearing guarantee.
              SERVER=skipok; COVERAGE=skipok; BROWSER=skipok; TREE=required; DOCKER=required ;;
            *)
              echo "::error::unknown or missing tier '$TIER'"
              FAIL=1
              SERVER=skipok; COVERAGE=skipok; BROWSER=skipok; TREE=skipok; DOCKER=skipok ;;
          esac

          expect "pipeline tier" "${{ needs.plan.result }}" required
          expect "lint and audit" "${{ needs.lint.result }}" required
          expect "server tests" "${{ needs.server-tests.result }}" "$SERVER"
          expect "coverage" "${{ needs.coverage.result }}" "$COVERAGE"
          expect "boot smoke" "${{ needs.boot.result }}" required
          expect "container image smoke" "${{ needs.docker.result }}" "$DOCKER"
          expect "browser QA" "${{ needs.browser.result }}" "$BROWSER"
          expect "tree check" "${{ needs.tree-check.result }}" "$TREE"

          if [ "$FAIL" -ne 0 ]; then
            echo "Tier gate FAILED for tier=$TIER"
            exit 1
          fi
          echo "Tier gate passed for tier=$TIER"
