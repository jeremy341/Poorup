name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: server
          fail_ci_if_error: false

  boot:
    name: boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check every shipped JS file
        run: |
          for f in server/*.js public/main.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      - name: Server boots and serves the app shell
        run: |
          PORT=8099 node server/server.js & SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS localhost:8099/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS localhost:8099/ | grep -qi poorup
          kill $SERVER_PID
