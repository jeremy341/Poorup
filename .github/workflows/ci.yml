name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run lint:client
      - name: Full contract, integration, and operations suite
        run: npm run test:full
      - run: npm run coverage
      - name: Server wire tests (handler scaffold)
        run: node server/server.test.js
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: server
          fail_ci_if_error: false

  boot:
    name: boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check every shipped JS file
        run: |
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find server public -type f -name '*.js' -print0)
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      - name: Server boots and serves the app shell
        run: |
          PORT=8099 node server/server.js & SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS localhost:8099/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS localhost:8099/ | grep -qi poorup
          curl -fsS localhost:8099/healthz | grep -q '"status":"ok"'
          curl -fsS localhost:8099/readyz | grep -q '"status":"ready"'
          kill $SERVER_PID

  browser:
    name: browser QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start the local parlor
        run: |
          PORT=8099 node server/server.js > /tmp/poorup-browser.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS localhost:8099/ >/dev/null 2>&1 && break
            sleep 0.5
          done
      - name: Four-viewport UI and accessibility contract
        env:
          POORUP_QA_BASE_URL: http://127.0.0.1:8099
        run: npm run test:browser -- --workers=2
