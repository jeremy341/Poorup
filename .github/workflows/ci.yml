name: CI

on:
  pull_request:
    branches: [main, development, testing]
  push:
    branches: [main, development, testing]

jobs:
  lint:
    name: lint and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run lint:client
      - name: Validate the unique test manifest
        run: node scripts/test-manifest.test.mjs

  server-tests:
    name: server and client contracts · shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run one deterministic manifest shard with server coverage
        run: >-
          npx c8 --temp-directory .nyc_output --include="server/**" --reporter=text
          node scripts/run-test-manifest.mjs --group=full
          --shard=${{ matrix.shard }}/4
          --timings=.test-timings/shard-${{ matrix.shard }}.json
      - name: Upload raw V8 coverage for merge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-shard-${{ matrix.shard }}
          path: .nyc_output
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload per-suite timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-shard-${{ matrix.shard }}
          path: .test-timings/shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [server-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download all test-shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-shard-*
          path: .nyc_output
          merge-multiple: true
      - name: Merge and report coverage
        run: npx c8 report --temp-directory .nyc_output --include="server/**" --reporter=text --reporter=lcov
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: server
          fail_ci_if_error: false

  boot:
    name: boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check every shipped JS file
        run: |
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find server public -type f -name '*.js' -print0)
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
      - name: Server boots and serves the app shell
        run: |
          PORT=8099 node server/server.js & SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS localhost:8099/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS localhost:8099/ | grep -qi poorup
          curl -fsS localhost:8099/healthz | grep -q '"status":"ok"'
          curl -fsS localhost:8099/readyz | grep -q '"status":"ready"'
          kill $SERVER_PID

  browser-shards:
    name: browser QA shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start the local parlor
        run: |
          PORT=8099 node server/server.js > /tmp/poorup-browser.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS localhost:8099/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS localhost:8099/healthz | grep -q '"status":"ok"'
      - name: Four-viewport UI and accessibility contract shard
        run: npm run test:browser -- --workers=2 --shard=${{ matrix.shard }}/3 --reporter=blob
        env:
          POORUP_QA_BASE_URL: http://127.0.0.1:8099
      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: warn

  browser-report:
    name: merged browser report
    runs-on: ubuntu-latest
    needs: [browser-shards]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download Playwright shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-shard-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=html all-blob-reports
      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: warn

  browser:
    name: browser QA
    runs-on: ubuntu-latest
    needs: [browser-shards, browser-report]
    if: always()
    steps:
      - name: Require every browser shard and report merge
        run: |
          test "${{ needs.browser-shards.result }}" = success
          test "${{ needs.browser-report.result }}" = success

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint, server-tests, coverage]
    if: always()
    steps:
      - name: Require lint, all manifest shards, and merged coverage
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.server-tests.result }}" = success
          test "${{ needs.coverage.result }}" = success
